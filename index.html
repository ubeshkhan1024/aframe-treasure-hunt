<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Haunted Treasure Hunt</title>

    <!-- A-FRAME -->
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- ========================================= -->
    <!-- HUD -->
    <!-- ========================================= -->

    <div id="hud">

        👻 HAUNTED TREASURE HUNT

        <br>

        <span id="counter">
            Treasures: 0 / 3
        </span>

        <br>

        <small>
            Find all three hidden treasures...
        </small>

    </div>


    <!-- ========================================= -->
    <!-- WIN SCREEN -->
    <!-- ========================================= -->

    <div id="winScreen">

        <div class="winBox">

            <h1>
                🏆 TREASURE FOUND!
            </h1>

            <p>
                You survived the haunted dungeon!
            </p>

            <button onclick="location.reload()">
                PLAY AGAIN
            </button>

        </div>

    </div>


    <!-- ========================================= -->
    <!-- A-FRAME SCENE -->
    <!-- ========================================= -->

    <a-scene
        background="color: #050609"
        fog="
            type: exponential;
            color: #08090d;
            density: 0.025;
        "
        renderer="antialias: true"
    >


        <!-- ===================================== -->
        <!-- CAMERA -->
        <!-- ===================================== -->

        <a-camera
            id="player"
            position="0 1.6 20"
            wasd-controls="
                acceleration: 35;
                fly: false;
            "
        >

            <a-cursor
                raycaster="
                    objects: .treasure-hitbox;
                    far: 30;
                "
                fuse="false"
                color="#ffffff"
                geometry="
                    primitive: ring;
                    radiusInner: 0.008;
                    radiusOuter: 0.014;
                "
            >
            </a-cursor>

        </a-camera>


        <!-- ===================================== -->
        <!-- LIGHTING -->
        <!-- ===================================== -->

        <a-light
            type="ambient"
            color="#303040"
            intensity="0.7"
        >
        </a-light>


        <a-light
            type="point"
            position="0 5 0"
            color="#ff8a32"
            intensity="2"
            distance="18"
        >
        </a-light>


        <a-light
            type="point"
            position="-15 3 -15"
            color="#ff4422"
            intensity="1.5"
            distance="10"
        >
        </a-light>


        <a-light
            type="point"
            position="15 3 -15"
            color="#00aaff"
            intensity="1.5"
            distance="10"
        >
        </a-light>


        <a-light
            type="point"
            position="15 3 15"
            color="#ff2244"
            intensity="1.5"
            distance="10"
        >
        </a-light>


        <!-- ===================================== -->
        <!-- FLOOR -->
        <!-- ===================================== -->

        <a-plane
            position="0 0 0"
            rotation="-90 0 0"
            width="48"
            height="48"
            material="
                color: #25221f;
                roughness: 1;
                metalness: 0;
            "
        >
        </a-plane>


        <!-- ===================================== -->
        <!-- OUTER WALLS -->
        <!-- ===================================== -->

        <a-box
            class="solid"
            position="0 2 -24"
            width="48"
            height="4"
            depth="1"
            material="
                color: #292727;
                roughness: 1;
            "
        >
        </a-box>


        <a-box
            class="solid"
            position="0 2 24"
            width="48"
            height="4"
            depth="1"
            material="
                color: #292727;
                roughness: 1;
            "
        >
        </a-box>


        <a-box
            class="solid"
            position="-24 2 0"
            width="1"
            height="4"
            depth="48"
            material="
                color: #242326;
                roughness: 1;
            "
        >
        </a-box>


        <a-box
            class="solid"
            position="24 2 0"
            width="1"
            height="4"
            depth="48"
            material="
                color: #242326;
                roughness: 1;
            "
        >
        </a-box>


        <!-- ===================================== -->
        <!-- MAZE WALLS -->
        <!-- ===================================== -->

        <a-box
            class="solid"
            position="-15 2 -16"
            width="18"
            height="4"
            depth="1"
            material="color: #302d2b"
        >
        </a-box>


        <a-box
            class="solid"
            position="-19 2 -11"
            width="1"
            height="4"
            depth="10"
            material="color: #302d2b"
        >
        </a-box>


        <a-box
            class="solid"
            position="-9 2 -11"
            width="1"
            height="4"
            depth="10"
            material="color: #302d2b"
        >
        </a-box>


        <a-box
            class="solid"
            position="-15 2 -5"
            width="10"
            height="4"
            depth="1"
            material="color: #302d2b"
        >
        </a-box>


        <a-box
            class="solid"
            position="-19 2 3"
            width="1"
            height="4"
            depth="15"
            material="color: #302d2b"
        >
        </a-box>


        <a-box
            class="solid"
            position="-9 2 6"
            width="1"
            height="4"
            depth="8"
            material="color: #302d2b"
        >
        </a-box>


        <a-box
            class="solid"
            position="-15 2 10"
            width="16"
            height="4"
            depth="1"
            material="color: #302d2b"
        >
        </a-box>


        <!-- ===================================== -->
        <!-- CENTER -->
        <!-- ===================================== -->

        <a-box
            class="solid"
            position="0 2 -15"
            width="7"
            height="4"
            depth="1"
            material="color: #302d2b"
        >
        </a-box>


        <a-box
            class="solid"
            position="7 2 -12"
            width="1"
            height="4"
            depth="8"
            material="color: #302d2b"
        >
        </a-box>


        <a-box
            class="solid"
            position="0 2 10"
            width="10"
            height="4"
            depth="1"
            material="color: #302d2b"
        >
        </a-box>


        <!-- ===================================== -->
        <!-- RIGHT SIDE -->
        <!-- ===================================== -->

        <a-box
            class="solid"
            position="15 2 -17"
            width="16"
            height="4"
            depth="1"
            material="color: #302d2b"
        >
        </a-box>


        <a-box
            class="solid"
            position="10 2 -12"
            width="1"
            height="4"
            depth="10"
            material="color: #302d2b"
        >
        </a-box>


        <a-box
            class="solid"
            position="21 2 -12"
            width="1"
            height="4"
            depth="10"
            material="color: #302d2b"
        >
        </a-box>


        <a-box
            class="solid"
            position="15 2 5"
            width="16"
            height="4"
            depth="1"
            material="color: #302d2b"
        >
        </a-box>


        <a-box
            class="solid"
            position="10 2 10"
            width="1"
            height="4"
            depth="10"
            material="color: #302d2b"
        >
        </a-box>


        <a-box
            class="solid"
            position="21 2 10"
            width="1"
            height="4"
            depth="10"
            material="color: #302d2b"
        >
        </a-box>


        <a-box
            class="solid"
            position="15 2 14"
            width="16"
            height="4"
            depth="1"
            material="color: #302d2b"
        >
        </a-box>


        <!-- ===================================== -->
        <!-- PILLARS -->
        <!-- ===================================== -->

        <a-cylinder
            class="solid"
            position="-13 2 -20"
            radius="1"
            height="4"
            color="#3a3430"
        >
        </a-cylinder>


        <a-cylinder
            class="solid"
            position="-5 2 -20"
            radius="1"
            height="4"
            color="#3a3430"
        >
        </a-cylinder>


        <a-cylinder
            class="solid"
            position="13 2 -20"
            radius="1"
            height="4"
            color="#3a3430"
        >
        </a-cylinder>


        <a-cylinder
            class="solid"
            position="19 2 -20"
            radius="1"
            height="4"
            color="#3a3430"
        >
        </a-cylinder>


        <a-cylinder
            class="solid"
            position="-20 2 17"
            radius="1"
            height="4"
            color="#3a3430"
        >
        </a-cylinder>


        <a-cylinder
            class="solid"
            position="20 2 18"
            radius="1"
            height="4"
            color="#3a3430"
        >
        </a-cylinder>


        <!-- ===================================== -->
        <!-- CRATES -->
        <!-- ===================================== -->

        <a-box
            class="solid"
            position="-5 0.8 5"
            width="1.6"
            height="1.6"
            depth="1.6"
            color="#60452e"
        >
        </a-box>


        <a-box
            class="solid"
            position="-3.3 0.8 5"
            width="1.6"
            height="1.6"
            depth="1.6"
            color="#60452e"
        >
        </a-box>


        <a-box
            class="solid"
            position="12 0.8 18"
            width="1.6"
            height="1.6"
            depth="1.6"
            color="#60452e"
        >
        </a-box>


        <!-- ===================================== -->
        <!-- TORCHES -->
        <!-- ===================================== -->

        <a-entity position="-20 2 -20">

            <a-cylinder
                radius="0.08"
                height="2"
                color="#21150e"
            ></a-cylinder>

            <a-sphere
                position="0 1.2 0"
                radius="0.25"
                color="#ff6a00"
                material="
                    emissive: #ff3300;
                    emissiveIntensity: 3;
                "
            ></a-sphere>

            <a-light
                type="point"
                color="#ff6a00"
                intensity="2"
                distance="7"
            ></a-light>

        </a-entity>


        <a-entity position="20 2 -20">

            <a-cylinder
                radius="0.08"
                height="2"
                color="#21150e"
            ></a-cylinder>

            <a-sphere
                position="0 1.2 0"
                radius="0.25"
                color="#ff6a00"
                material="
                    emissive: #ff3300;
                    emissiveIntensity: 3;
                "
            ></a-sphere>

            <a-light
                type="point"
                color="#ff6a00"
                intensity="2"
                distance="7"
            ></a-light>

        </a-entity>


        <a-entity position="-20 2 20">

            <a-cylinder
                radius="0.08"
                height="2"
                color="#21150e"
            ></a-cylinder>

            <a-sphere
                position="0 1.2 0"
                radius="0.25"
                color="#ff6a00"
                material="
                    emissive: #ff3300;
                    emissiveIntensity: 3;
                "
            ></a-sphere>

            <a-light
                type="point"
                color="#ff6a00"
                intensity="2"
                distance="7"
            ></a-light>

        </a-entity>


        <a-entity position="20 2 20">

            <a-cylinder
                radius="0.08"
                height="2"
                color="#21150e"
            ></a-cylinder>

            <a-sphere
                position="0 1.2 0"
                radius="0.25"
                color="#ff6a00"
                material="
                    emissive: #ff3300;
                    emissiveIntensity: 3;
                "
            ></a-sphere>

            <a-light
                type="point"
                color="#ff6a00"
                intensity="2"
                distance="7"
            ></a-light>

        </a-entity>


        <!-- ===================================== -->
        <!-- GHOST 1 -->
        <!-- ===================================== -->

        <a-entity
            id="ghost1"
            position="0 1.5 -6"
        >

            <!-- HEAD / BODY -->

            <a-sphere
                position="0 0.25 0"
                radius="0.75"
                material="
                    color: #e8e8ff;
                    emissive: #7777cc;
                    emissiveIntensity: 1.2;
                    transparent: true;
                    opacity: 0.88;
                "
            ></a-sphere>


            <!-- LOWER GHOST BODY -->

            <a-cone
                position="0 -0.65 0"
                radius-bottom="0.75"
                radius-top="0.55"
                height="1.5"
                material="
                    color: #e8e8ff;
                    emissive: #7777cc;
                    emissiveIntensity: 1.2;
                    transparent: true;
                    opacity: 0.88;
                "
            ></a-cone>


            <!-- LEFT EYE -->

            <a-sphere
                position="-0.25 0.35 0.67"
                radius="0.12"
                material="
                    color: #ff2222;
                    emissive: #ff0000;
                    emissiveIntensity: 5;
                "
            ></a-sphere>


            <!-- RIGHT EYE -->

            <a-sphere
                position="0.25 0.35 0.67"
                radius="0.12"
                material="
                    color: #ff2222;
                    emissive: #ff0000;
                    emissiveIntensity: 5;
                "
            ></a-sphere>


            <!-- MOUTH -->

            <a-sphere
                position="0 0.02 0.72"
                scale="0.22 0.32 0.08"
                material="
                    color: #111111;
                    emissive: #000000;
                "
            ></a-sphere>


            <!-- GHOST GLOW -->

            <a-light
                type="point"
                color="#7777ff"
                intensity="0.7"
                distance="4"
            ></a-light>

        </a-entity>


        <!-- ===================================== -->
        <!-- GHOST 2 -->
        <!-- ===================================== -->

        <a-entity
            id="ghost2"
            position="-6 1.5 -2"
        >

            <!-- HEAD / BODY -->

            <a-sphere
                position="0 0.25 0"
                radius="0.7"
                material="
                    color: #dfffff;
                    emissive: #00aaaa;
                    emissiveIntensity: 1.3;
                    transparent: true;
                    opacity: 0.85;
                "
            ></a-sphere>


            <!-- LOWER GHOST BODY -->

            <a-cone
                position="0 -0.6 0"
                radius-bottom="0.7"
                radius-top="0.5"
                height="1.4"
                material="
                    color: #dfffff;
                    emissive: #00aaaa;
                    emissiveIntensity: 1.3;
                    transparent: true;
                    opacity: 0.85;
                "
            ></a-cone>


            <!-- LEFT EYE -->

            <a-sphere
                position="-0.22 0.35 0.62"
                radius="0.11"
                material="
                    color: #00ffff;
                    emissive: #00ffff;
                    emissiveIntensity: 5;
                "
            ></a-sphere>


            <!-- RIGHT EYE -->

            <a-sphere
                position="0.22 0.35 0.62"
                radius="0.11"
                material="
                    color: #00ffff;
                    emissive: #00ffff;
                    emissiveIntensity: 5;
                "
            ></a-sphere>


            <!-- MOUTH -->

            <a-sphere
                position="0 0.02 0.67"
                scale="0.2 0.3 0.08"
                material="
                    color: #111111;
                    emissive: #000000;
                "
            ></a-sphere>


            <!-- GHOST GLOW -->

            <a-light
                type="point"
                color="#00ffff"
                intensity="0.7"
                distance="4"
            ></a-light>

        </a-entity>


        <!-- ===================================== -->
        <!-- TREASURE 1 - GOLD CHEST -->
        <!-- ===================================== -->

        <a-entity
            class="treasure"
            position="-15 1.1 -19"
        >

            <!-- INVISIBLE CLICK AREA -->

            <a-box
                class="treasure-hitbox"
                width="2.5"
                height="2.5"
                depth="2.5"
                material="
                    transparent: true;
                    opacity: 0;
                "
            ></a-box>


            <!-- CHEST -->

            <a-box
                position="0 0 0"
                width="1.6"
                height="0.8"
                depth="1.1"
                color="#b8860b"
                material="
                    metalness: 0.8;
                    roughness: 0.25;
                "
            ></a-box>


            <!-- CHEST LID -->

            <a-box
                position="0 0.48 0"
                width="1.65"
                height="0.18"
                depth="1.15"
                color="#ffd700"
            ></a-box>


            <!-- CHEST LOCK -->

            <a-torus
                position="0 0.1 -0.58"
                rotation="90 0 0"
                radius="0.18"
                radius-tubular="0.04"
                color="#ffd700"
            ></a-torus>

        </a-entity>


        <!-- ===================================== -->
        <!-- TREASURE 2 - CRYSTAL -->
        <!-- ===================================== -->

        <a-entity
            class="treasure"
            position="17 1.4 -15"
            animation="
                property: position;
                to: 17 1.8 -15;
                dir: alternate;
                loop: true;
                dur: 1200;
                easing: easeInOutSine;
            "
        >

            <!-- INVISIBLE CLICK AREA -->

            <a-sphere
                class="treasure-hitbox"
                radius="1.2"
                material="
                    transparent: true;
                    opacity: 0;
                "
            ></a-sphere>


            <!-- CRYSTAL -->

            <a-entity
                geometry="
                    primitive: octahedron;
                    radius: 0.7;
                "
                material="
                    color: #00D9FF;
                    metalness: 0.55;
                    roughness: 0.05;
                    emissive: #006B80;
                    emissiveIntensity: 2;
                "
                animation="
                    property: rotation;
                    to: 360 360 0;
                    loop: true;
                    dur: 3000;
                    easing: linear;
                "
            ></a-entity>


            <a-light
                type="point"
                color="#00D9FF"
                intensity="1.5"
                distance="4"
            ></a-light>

        </a-entity>


        <!-- ===================================== -->
        <!-- TREASURE 3 - RUBY -->
        <!-- ===================================== -->

        <a-entity
            class="treasure"
            position="-17 1.1 15"
        >

            <!-- INVISIBLE CLICK AREA -->

            <a-sphere
                class="treasure-hitbox"
                radius="1.3"
                material="
                    transparent: true;
                    opacity: 0;
                "
            ></a-sphere>


            <!-- RUBY -->

            <a-entity
                geometry="
                    primitive: dodecahedron;
                    radius: 0.8;
                "
                material="
                    color: #ff1744;
                    metalness: 0.65;
                    roughness: 0.1;
                    emissive: #660011;
                    emissiveIntensity: 2;
                "
                animation="
                    property: rotation;
                    to: 360 360 360;
                    loop: true;
                    dur: 2500;
                    easing: linear;
                "
            ></a-entity>


            <a-light
                type="point"
                color="#ff1744"
                intensity="1.5"
                distance="4"
            ></a-light>

        </a-entity>


    </a-scene>


    <!-- ========================================= -->
    <!-- GAME LOGIC -->
    <!-- ========================================= -->

    <script src="js/game.js"></script>

</body>

</html>
